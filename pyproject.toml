[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repoarchaeology"
version = "0.1.7"
description = "Herramienta de análisis forense de repositorios, linaje de decisiones y detección de deuda técnica oculta."
readme = "README.md"
authors = [
  { name = "Araxel", email = "araxel19@users.noreply.github.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["git", "forensics", "code-churn", "software-architecture", "cli", "tui", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "rich>=13.7.0",
    "typer>=0.9.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
tui = [
    "textual>=0.47.0"
]
ai = [
    "google-generativeai>=0.3.0",
    "requests>=2.31.0"
]
dev = [
    "pytest>=7.4.0",
    "black>=23.12.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0"
]

[project.scripts]
repoarchaeology = "repoarchaeology.cli.entrypoint:main"
repoarch = "repoarchaeology.cli.entrypoint:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["repoarchaeology*"]
